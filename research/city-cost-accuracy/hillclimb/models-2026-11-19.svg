<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" width="760" height="636" role="img" aria-labelledby="t d">
<title id="t">City-cost accuracy by model and effort, relative to GPT-6 Luna max</title>
<desc id="d">For each model and effort, the difference in budget-weighted loss from GPT-6 Luna max on the same cities, each model with its own per-anchor correction, with 95% paired bootstrap intervals. Positive is less accurate than Luna.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e8e7e3; --zero:#52514e;
    --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#2e2e2c; --zero:#c3c2b7;
    --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; } .sub { font-size: 12px; } .lbl { fill: var(--ink); font-size: 12.5px; }
  .val { font-variant-numeric: tabular-nums; } .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .row:hover .hit { fill: var(--grid); }
</style><rect width="760" height="636" fill="var(--surface)"/>
