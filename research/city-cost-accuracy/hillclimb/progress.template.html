<title>City Cost Hill Climb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide instrument panel (summary strip, chart, legend) over a compact experiment register. */
:root {
  --bg: #f3f6f2; --surface: #fbfcfa; --ink: #16221e; --muted: #5d6c66; --faint: #8e9b96; --grid: #dde4df;
  --accent: #19705b; --accent-soft: rgba(25,112,91,.10); --ref: #a8692a; --band: rgba(22,34,30,.035); --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #6250d6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1614; --surface: #141d1a; --ink: #e5ece9; --muted: #9aaaa4; --faint: #6c7a75; --grid: #24312d;
  --accent: #4cc39f; --accent-soft: rgba(76,195,159,.12); --ref: #d6a15c; --band: rgba(229,236,233,.035); --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #141d1a; --ink: #e5ece9; --muted: #9aaaa4; --faint: #6c7a75; --grid: #24312d;
  --accent: #4cc39f; --accent-soft: rgba(76,195,159,.12); --ref: #d6a15c; --band: rgba(229,236,233,.035); --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.wrap > * { min-width: 0; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.summary { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--mono); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); margin-left: 6px; }
.stat.best .v { color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 18px 18px 12px; min-width: 0; }
#chart { width: 100%; display: block; }
#chart text { font-family: var(--mono); fill: var(--muted); font-size: 11px; }
#chart .axis-title { font-family: var(--body); fill: var(--muted); font-size: 12px; }
#chart .band-label { font-family: var(--body); font-size: 12px; font-weight: 600; fill: var(--ink); }
#chart .end-label { font-family: var(--mono); font-size: 12px; fill: var(--ink); font-weight: 500; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.legend .sw { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.pt { cursor: pointer; }
.pt:focus { outline: none; }
.pt:focus .hit, .pt:hover .hit { stroke: var(--ink); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 13px; padding: 10px 2px 2px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { overflow: visible; }
.note { color: var(--muted); font-size: 13px; max-width: 80ch; margin: 0; }
.tip { position: fixed; pointer-events: none; z-index: 5; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.45; border-radius: 6px; padding: 8px 10px; max-width: 280px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.tip b { font-weight: 600; }
.tip .m { font-family: var(--mono); }
h2 { font-family: var(--display); font-weight: 500; font-size: 20px; margin: 0 0 10px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.num { text-align: right; }
tr.sep td { background: var(--band); font-weight: 600; font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--grid); color: var(--muted); white-space: nowrap; }
.pill.not_adopted { color: var(--accent); }
.pill.accept { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.pill.reference, .pill.baseline { color: var(--ref); }
.pill.pending { border-style: dashed; }
footer { color: var(--faint); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .best-path { transition: opacity .3s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>City Cost Hill Climb</h1>
      <p class="sub">Each point is one experiment on Holiday Spend's city-cost estimates, scored against reference prices. Lower is better. Each panel's line tracks its best accepted method. Panels share one axis, numbered by step within the panel.</p>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <section class="panel" aria-label="Error by experiment">
    <svg id="chart" role="img" aria-label="Error by experiment with best-so-far line"></svg>
    <div class="legend" id="legend"></div>
  </section>

  <p class="note" id="note"></p>

  <section>
    <h2>Experiment register</h2>
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const DATA = /*DATA*/null;
const pct = e => Math.round((Math.exp(e) - 1) * 100);
const fmt = v => v === null || v === undefined ? '–' : v.toFixed(3);
const VLABEL = { accept: 'Accepted', not_adopted: 'Passed, not adopted', reject: 'Rejected', promising_extend: 'Promising', invalid_coverage: 'Invalid', pending: 'Running', unassessed: 'Scored', reference: 'Reference', baseline: 'Baseline' };

const PCOL = { R1: 'var(--s1)', R2: 'var(--s2)', R3: 'var(--s3)', Test: 'var(--s4)' };
let showRaw = false;
// Position of each experiment within its panel (1, 2, ...): every panel shares one x-axis of hill-climb steps.
const stepOf = r => DATA.rows.filter(x => x.panel === r.panel && x.n <= r.n).length;

function bestSeries(rows) {
  // Best accepted method so far, per panel: starts at the panel's baseline and steps down on each accepted change.
  const out = [];
  for (const panel of DATA.panelOrder) {
    const pr = rows.filter(r => r.panel === panel);
    let best = null;
    for (const r of pr) {
      if (r.kind === 'baseline' && r.error !== null) best = r.error;
      else if (r.verdict === 'accept' && r.error !== null && (best === null || r.error < best)) best = r.error;
      if (best !== null) out.push({ n: r.n, panel, best });
    }
  }
  return out;
}

function render() {
  const rows = DATA.rows, svg = document.getElementById('chart');
  const W = Math.max(320, svg.clientWidth || svg.parentNode.clientWidth), narrow = W < 560;
  const H = narrow ? 340 : 400, m = { l: narrow ? 44 : 56, r: narrow ? 92 : 128, t: 16, b: 44 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  const errs = rows.flatMap(r => showRaw ? [r.error, r.raw] : [r.error]).filter(v => v !== null);
  const y0 = Math.floor((Math.min(...errs) - 0.008) * 50) / 50, y1 = Math.ceil((Math.max(...errs) + 0.008) * 50) / 50;
  const steps = Math.max(...rows.map(stepOf));
  const slot = (W - m.l - m.r) / steps;
  const off = { R1: -0.15, R2: -0.05, R3: 0.05, Test: 0.15 };
  const X = r => m.l + slot * (stepOf(r) - 0.5 + (off[r.panel] || 0));
  const Y = v => m.t + (y1 - v) / (y1 - y0) * (H - m.t - m.b);
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  svg.innerHTML = '';

  // Grid and axes
  const stepY = (y1 - y0) > 0.2 ? 0.04 : 0.02;
  for (let v = y0; v <= y1 + 1e-9; v += stepY) {
    const y = Y(v);
    el('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: 'var(--grid)', 'stroke-width': 1 });
    el('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end' }).textContent = v.toFixed(2);
    el('text', { x: W - m.r + 6, y: y + 4, 'text-anchor': 'start' }).textContent = '≈' + pct(v) + '%';
  }
  for (let s = 1; s <= steps; s++) el('text', { x: m.l + slot * (s - 0.5), y: H - m.b + 18, 'text-anchor': 'middle' }).textContent = s;
  el('text', { x: (m.l + W - m.r) / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis-title' }).textContent = 'Experiment step within its panel';
  const ly = el('text', { x: 12, y: (m.t + H - m.b) / 2, 'text-anchor': 'middle', class: 'axis-title', transform: `rotate(-90 12 ${(m.t + H - m.b) / 2})` });
  ly.textContent = narrow ? 'Error' : 'Error (budget-weighted mean |log error|)';

  // Best-so-far step line per panel, in the panel's colour, extended to the right edge with a direct end label
  const best = bestSeries(rows), labels = [];
  for (const panel of DATA.panelOrder) {
    const pts = best.filter(b => b.panel === panel);
    if (!pts.length) continue;
    let d = '', prev = null;
    pts.forEach(p => { const x = X(rows.find(r => r.n === p.n)), y = Y(p.best);
      if (prev === null) d += `M${x},${y}`; else d += ` L${x},${Y(prev)} L${x},${y}`; prev = p.best; });
    const last = pts[pts.length - 1];
    d += ` L${W - m.r},${Y(last.best)}`;
    el('path', { d, fill: 'none', stroke: PCOL[panel], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    labels.push({ panel, y: Y(last.best) + 4, v: last.best });
  }
  // End labels sit past the % axis, nudged apart so they never collide
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 15) labels[i].y = labels[i - 1].y + 15;
  const lx = W - m.r + (narrow ? 36 : 42);
  for (const l of labels) {
    el('circle', { cx: lx, cy: l.y - 4, r: 3.5, fill: PCOL[l.panel] });
    el('text', { x: lx + 7, y: l.y, class: 'end-label' }).textContent = narrow ? l.v.toFixed(3) : `${l.panel} ${l.v.toFixed(3)}`;
  }

  // Raw ghosts (optional), then points
  const tip = document.getElementById('tip');
  rows.forEach(r => {
    const x = X(r), c = PCOL[r.panel];
    if (showRaw && r.raw !== null && r.error !== null) {
      el('line', { x1: x, x2: x, y1: Y(r.raw), y2: Y(r.error), stroke: c, 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: .6 });
      el('circle', { cx: x, cy: Y(r.raw), r: 2.6, fill: c, opacity: .6 });
    }
    const g = el('g', { class: 'pt', tabindex: 0, 'aria-label': `${r.n}. ${r.label} (${DATA.panels[r.panel].label}): ${fmt(r.error)}, ${VLABEL[r.verdict] || r.verdict}` });
    const yy = r.error === null ? Y((y0 + y1) / 2) : Y(r.error);
    const ring = { stroke: 'var(--surface)', 'stroke-width': 2 };
    if (r.verdict === 'reference') el('path', { d: `M${x},${yy - 6} L${x + 6},${yy} L${x},${yy + 6} L${x - 6},${yy} Z`, fill: c, ...ring, class: 'hit' }, g);
    else if (r.verdict === 'baseline') el('rect', { x: x - 5, y: yy - 5, width: 10, height: 10, fill: c, ...ring, class: 'hit' }, g);
    else if (r.verdict === 'accept') el('circle', { cx: x, cy: yy, r: 5.5, fill: c, ...ring, class: 'hit' }, g);
    else el('circle', { cx: x, cy: yy, r: 4.5, fill: 'var(--surface)', stroke: c, 'stroke-width': r.verdict === 'not_adopted' ? 2.4 : 1.4, 'stroke-dasharray': r.verdict === 'pending' ? '2 2' : 'none', class: 'hit' }, g);
    el('circle', { cx: x, cy: yy, r: 11, fill: 'transparent' }, g);
    const show = ev => {
      const ci = r.ci ? ` <span class="m">(95% CI ${r.ci[0].toFixed(3)} to ${r.ci[1].toFixed(3)})</span>` : '';
      tip.innerHTML = `<b>${r.n}. ${r.label}</b><br>${DATA.panels[r.panel].label}<br>Error <span class="m">${fmt(r.error)}</span>${r.error !== null ? ` (≈${pct(r.error)}% typical)` : ''}` +
        (r.raw !== null ? `<br>Raw before correction <span class="m">${fmt(r.raw)}</span>` : '') +
        (r.improvement !== null ? `<br>Change vs incumbent <span class="m">${r.improvement >= 0 ? '−' : '+'}${Math.abs(r.improvement).toFixed(3)}</span>${ci}` : '') +
        `<br>${VLABEL[r.verdict] || r.verdict}`;
      tip.hidden = false;
      const b = (ev.type === 'focus' ? g.getBoundingClientRect() : { left: ev.clientX, top: ev.clientY, width: 0 });
      const tx = Math.min(window.innerWidth - 296, b.left + (b.width || 0) / 2 + 14), ty = b.top + 14;
      tip.style.left = Math.max(8, tx) + 'px'; tip.style.top = Math.min(window.innerHeight - 170, ty) + 'px';
    };
    g.addEventListener('mousemove', show); g.addEventListener('focus', show);
    g.addEventListener('mouseleave', () => tip.hidden = true); g.addEventListener('blur', () => tip.hidden = true);
  });
}

function legend() {
  const shapes = `<span><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="var(--muted)"/></svg>Accepted</span>` +
    `<span><svg width="10" height="10"><circle cx="5" cy="5" r="3.8" fill="var(--surface)" stroke="var(--muted)" stroke-width="2.4"/></svg>Passed, not adopted</span>` +
    `<span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.3"/></svg>Rejected</span>` +
    `<span><svg width="10" height="10"><rect x="1" y="1" width="8" height="8" fill="var(--muted)"/></svg>Baseline</span>` +
    `<span><svg width="12" height="12"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="var(--muted)"/></svg>Old v1 prices</span>`;
  document.getElementById('legend').innerHTML = DATA.panelOrder.map(p => `<span><i class="sw" style="background:${PCOL[p]}"></i>${DATA.panels[p].label}</span>`).join('') +
    shapes + `<label class="toggle"><input type="checkbox" id="raw"> Show raw scores before correction</label>`;
  document.getElementById('raw').addEventListener('change', e => { showRaw = e.target.checked; render(); });
}

function fill() {
  const rows = DATA.rows, best = bestSeries(rows);
  const bR2 = best.filter(b => b.panel === DATA.headline.panel).pop();
  const base2 = rows.find(r => r.panel === DATA.headline.panel && r.kind === 'baseline');
  const test = best.filter(b => b.panel === 'Test').pop();
  const done = rows.filter(r => !['reference', 'baseline', 'pending'].includes(r.verdict)).length;
  const acc = rows.filter(r => r.verdict === 'accept').length;
  const stat = (k, v, cls = '') => `<div class="stat ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  document.getElementById('summary').innerHTML =
    (bR2 ? stat(DATA.headline.label, `${bR2.best.toFixed(3)}<small>≈${pct(bR2.best)}%</small>`, 'best') : '') +
    (test ? stat('Held-out test, 142 cities', `${test.best.toFixed(3)}<small>≈${pct(test.best)}%</small>`) : '') +
    (base2 && base2.error !== null ? stat('Unchanged v1.1', `${base2.error.toFixed(3)}<small>≈${pct(base2.error)}%</small>`) : '') +
    stat('Experiments judged', `${done}<small>${acc} accepted</small>`);
  document.getElementById('note').textContent =
    DATA.note + ' ' +
    'Prompt changes are judged after re-fitting their own correction factors, so a raw gain that only shifts prices up or down earns no credit. ' +
    'Some rejected points sit below the line because their gain was too small to separate from noise.';
  const t = document.getElementById('tbl');
  let html = '<thead><tr><th>#</th><th>Experiment</th><th class="num">Error</th><th class="num">Raw</th><th class="num">Change (95% CI)</th><th>Result</th></tr></thead><tbody>';
  let lastPanel = null;
  for (const r of rows) {
    if (r.panel !== lastPanel) { html += `<tr class="sep"><td colspan="6">${DATA.panels[r.panel].label}</td></tr>`; lastPanel = r.panel; }
    const ch = r.improvement !== null ? `${r.improvement >= 0 ? '−' : '+'}${Math.abs(r.improvement).toFixed(3)} (${r.ci[0].toFixed(3)}, ${r.ci[1].toFixed(3)})` : '–';
    html += `<tr><td class="num">${r.n}</td><td>${r.label}</td><td class="num">${fmt(r.error)}</td><td class="num">${fmt(r.raw)}</td><td class="num">${ch}</td><td><span class="pill ${r.verdict}">${VLABEL[r.verdict] || r.verdict}</span></td></tr>`;
  }
  t.innerHTML = html + '</tbody>';
  document.getElementById('foot').textContent = `Updated ${new Date(DATA.updated).toUTCString().replace(':00 GMT', ' UTC')}. Error is the budget-weighted mean absolute log error per city, averaged over dev cities; ≈% is exp(error) − 1.`;
}
fill(); legend(); render();
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
</script>
