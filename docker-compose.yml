services:
  holiday-spend:
    # The VPS pulls the image CI publishes; `--build` still builds from source.
    image: ${HOLIDAY_SPEND_IMAGE:-ghcr.io/mwilczynska/holiday-spend:main}
    build:
      context: .
      target: runner
    restart: unless-stopped
    # Host loopback only, for health checks from the VPS shell. Public traffic arrives from
    # the shared edge proxy over the external `edge` network.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - edge
    volumes:
      - ./runtime-data:/app/data
    env_file:
      - ${HOLIDAY_SPEND_ENV_FILE:-.env.production.local}
    environment:
      - HOLIDAY_SPEND_DB_PATH=/app/data/travel.db
      - HOLIDAY_SPEND_REQUIRE_DATABASE=true
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  seed:
    build:
      context: .
      target: seed
    profiles: ["tools"]
    volumes:
      - ./runtime-data:/app/data
    env_file:
      - ${HOLIDAY_SPEND_ENV_FILE:-.env.production.local}
    environment:
      - HOLIDAY_SPEND_DB_PATH=/app/data/travel.db

  backup:
    image: ${HOLIDAY_SPEND_IMAGE:-ghcr.io/mwilczynska/holiday-spend:main}
    build:
      context: .
      target: runner
    profiles: ["tools"]
    entrypoint: ["node", "scripts/backup.mjs"]
    volumes:
      - ./runtime-data:/app/data:ro
      - ./backups:/backups
    environment:
      - HOLIDAY_SPEND_DB_PATH=/app/data/travel.db

networks:
  edge:
    external: true
